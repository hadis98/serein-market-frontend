<article
  class="group overflow-hidden rounded-3xl bg-serein-surface transition duration-300 hover:-translate-y-1 hover:shadow-lg"
>
  <div class="aspect-square overflow-hidden bg-white">
    <img
      class="h-full w-full object-contain p-6 transition duration-500 group-hover:scale-105"
      [src]="product().productImageUrl"
      [alt]="product().productName"
    />
  </div>

  <div class="p-5">
    <p class="mb-2 text-xs uppercase tracking-widest text-serein-accent">
      {{ product().categoryName }}
    </p>

    <h2 class="font-display text-xl text-serein-text">
      {{ product().productName }}
    </h2>

    <p class="mt-2 line-clamp-2 text-sm opacity-70">
      {{ product().productDescription }}
    </p>

    <div class="mt-5 flex items-center justify-between">
      <span class="text-lg font-semibold">
        {{ product().productPrice | currency:'INR':'symbol':'1.0-0' }}
      </span>

      <button
        class="rounded-full bg-serein-brand px-5 py-2 text-sm text-white transition hover:opacity-90"
      >
        Add to cart
      </button>
    </div>
  </div>
</article>
