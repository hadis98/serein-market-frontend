<article
  class="group flex h-full flex-col overflow-hidden rounded-3xl bg-serein-surface transition duration-300 hover:-translate-y-1 hover:shadow-lg"
>
  <div class="relative aspect-square overflow-hidden bg-white">
    <a [routerLink]="['/products', product().productId]">
      <img
        class="h-full w-full object-contain p-6 transition duration-500 group-hover:scale-105"
        [src]="product().productImageUrl"
        [alt]="product().productName"
      />
    </a>

    <button
      type="button"
      class="absolute right-4 top-4 flex h-10 w-10 items-center justify-center rounded-full bg-serein-surface shadow-sm"
      [attr.aria-label]="
        wishlist.isSaved(product().productId) ? 'Remove from wishlist' : 'Add to wishlist'
      "
      (click)="toggleWishlist()"
    >
      @if (wishlist.isSaved(product().productId)) {
        ♥
      } @else {
        ♡
      }
    </button>
  </div>

  <div class="flex flex-1 flex-col p-5">
    <p class="text-center sm:text-left mb-2 text-xs uppercase tracking-widest text-serein-accent">
      {{ product().categoryName }}
    </p>

    <a [routerLink]="['/products', product().productId]">
      <h2 class="text-center sm:text-left font-display text-xl text-serein-text">
        {{ product().productName }}
      </h2>
    </a>

    <div class="mt-auto pt-5">
      <p class="text-center text-lg font-semibold sm:text-left">
        {{ product().productPrice | currency: 'USD' : 'symbol' : '1.0-2' }}
      </p>

      <p
        class="mt-2 flex items-center justify-center gap-2 text-sm sm:justify-start"
        [class.text-serein-text]="isInStock()"
        [class.text-serein-accent]="!isInStock()"
        role="status"
      >
        <span
          class="h-2.5 w-2.5 shrink-0 rounded-full"
          [class.bg-emerald-600]="isInStock()"
          [class.bg-serein-accent]="!isInStock()"
          aria-hidden="true"
        ></span>
        {{ isInStock() ? 'In stock' : 'Out of stock' }}
      </p>

      <button
        type="button"
        class="mt-4 flex w-full items-center justify-center gap-2 rounded-full bg-serein-brand px-5 py-2.5 text-sm font-medium text-white transition hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-serein-brand disabled:cursor-not-allowed disabled:bg-black/10 disabled:text-serein-text/45 disabled:opacity-100"
        [disabled]="!isInStock()"
        [attr.aria-label]="isInStock() ? 'Add ' + product().productName + ' to cart' : null"
        (click)="addToCart()"
      >
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="20" r="1"></circle>
          <circle cx="19" cy="20" r="1"></circle>
          <path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"></path>
        </svg>
        {{ isInStock() ? 'Add to cart' : 'Out of stock' }}
      </button>
    </div>
  </div>
</article>
