<div class="relative" data-product-sort>
  <button
    type="button"
    id="product-sort"
    class="group flex h-14 min-w-[190px] items-center gap-3 rounded-2xl border border-black/10 bg-serein-surface px-3.5 text-left shadow-[0_3px_12px_rgba(51,43,39,0.035)] transition hover:border-serein-brand/40 hover:shadow-[0_6px_18px_rgba(51,43,39,0.07)] focus-visible:border-serein-brand focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-serein-brand/10 sm:min-w-[210px]"
    aria-haspopup="listbox"
    aria-controls="product-sort-options"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-serein-bg text-serein-brand transition group-hover:bg-[#efe4dc]"
      aria-hidden="true"
    >
      <app-icon [name]="selectedOption.icon" class="h-[18px] w-[18px]" />
    </span>

    <span class="min-w-0 flex-1">
      <span
        class="block text-[9px] font-medium uppercase leading-none tracking-[0.2em] text-serein-text/40"
      >
        Sort by
      </span>

      <span class="mt-1.5 block truncate text-[13px] font-medium leading-none">
        {{ selectedOption.label }}
      </span>
    </span>

    <app-icon
      name="chevron-down-wide"
      class="h-4 w-4 shrink-0 text-serein-text/45 transition-transform duration-200"
      [class.rotate-180]="menuOpen()"
    />
  </button>

  @if (menuOpen()) {
    <div
      id="product-sort-options"
      class="product-sort-menu absolute right-0 top-full z-40 mt-2 w-[min(17rem,calc(100vw-3rem))] overflow-hidden rounded-2xl border border-black/[0.07] bg-serein-surface p-2 shadow-[0_20px_55px_rgba(51,43,39,0.16)]"
      role="listbox"
      aria-label="Sort products"
      [attr.aria-activedescendant]="'product-sort-' + value()"
    >
      <div class="px-3 pb-2 pt-1.5">
        <p class="text-[10px] font-medium uppercase tracking-[0.2em] text-serein-text/40">
          Sort products
        </p>
      </div>

      @for (option of options; track option.value) {
        <button
          type="button"
          [id]="'product-sort-' + option.value"
          class="group/option flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left transition hover:bg-serein-bg focus-visible:bg-serein-bg focus-visible:outline-none"
          role="option"
          [attr.aria-selected]="value() === option.value"
          [class.bg-serein-bg]="value() === option.value"
          (click)="select(option.value)"
        >
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-black/[0.06] bg-white/70 text-serein-text/55 transition group-hover/option:border-serein-brand/20 group-hover/option:text-serein-brand"
            [class.!border-serein-brand/20]="value() === option.value"
            [class.!bg-[#efe4dc]]="value() === option.value"
            [class.!text-serein-brand]="value() === option.value"
            aria-hidden="true"
          >
            <app-icon [name]="option.icon" class="h-4 w-4" />
          </span>

          <span class="min-w-0 flex-1">
            <span class="block text-[13px] font-medium">
              {{ option.label }}
            </span>

            <span class="mt-0.5 block text-[11px] text-serein-text/45">
              {{ option.description }}
            </span>
          </span>

          <span
            class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-serein-brand text-white transition"
            [class.opacity-0]="value() !== option.value"
            aria-hidden="true"
          >
            <app-icon name="check" class="h-3 w-3" />
          </span>
        </button>
      }
    </div>
  }
</div>
