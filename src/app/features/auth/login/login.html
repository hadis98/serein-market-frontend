<section class="mx-auto flex min-h-[75vh] max-w-7xl items-center px-6 py-16">
  <div
    class="mx-auto grid w-full max-w-5xl overflow-hidden rounded-[3rem] bg-serein-surface lg:grid-cols-2"
  >
    <div
      class="hidden min-h-[600px] bg-serein-brand p-12 text-white lg:flex lg:flex-col lg:justify-end"
    >
      <p class="text-xs uppercase tracking-[0.3em] opacity-70">Welcome back</p>

      <h1 class="mt-4 font-display text-5xl">
        Your basket
        <br />
        is waiting.
      </h1>
    </div>

    <div class="p-8 md:p-14">
      <p class="text-xs uppercase tracking-[0.3em] text-serein-brand">Account</p>

      <h1 class="mt-3 font-display text-4xl">Sign in</h1>

      <form [formRoot]="loginForm" class="mt-10 space-y-6">
        <!-- MOBILE -->
        <div>
          <label class="mb-2 block text-sm"> Mobile number </label>

          <input
            type="tel"
            [formField]="loginForm.mobileNo"
            class="w-full rounded-2xl border border-black/10 bg-white px-5 py-4 outline-none focus:border-serein-brand"
          />

          @if (loginForm.mobileNo().touched() && loginForm.mobileNo().invalid()) {
            <p class="mt-2 text-sm text-red-700">Mobile number is required</p>
          }
        </div>

        <!-- PASSWORD -->
        <div>
          <label class="mb-2 block text-sm"> Password </label>

          <input
            type="password"
            [formField]="loginForm.password"
            class="w-full rounded-2xl border border-black/10 bg-white px-5 py-4 outline-none focus:border-serein-brand"
          />
        </div>

        @if (errorMessage()) {
          <p class="rounded-2xl bg-red-50 p-4 text-sm text-red-700">
            {{ errorMessage() }}
          </p>
        }

        <button type="submit" class="w-full rounded-2xl bg-serein-brand px-6 py-4 text-white">
          Sign in
        </button>
      </form>

      <p class="mt-8 text-center text-sm opacity-70">
        New to Serein?

        <a routerLink="/register" class="font-medium text-serein-brand"> Create an account </a>
      </p>
    </div>
  </div>
</section>
