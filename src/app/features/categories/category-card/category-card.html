<a
  routerLink="/products"
  [queryParams]="{ category: category().categoryId }"
  class="group flex flex-col items-center text-center focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-serein-brand"
>
  <div
    class="aspect-square w-full overflow-hidden rounded-full bg-[#eee9e2] transition duration-300 group-hover:-translate-y-1 group-hover:shadow-lg"
  >
    <img
      [src]="imageUrl()"
      [alt]="displayName()"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
    />
  </div>

  <h3 class="mt-3 text-xs font-medium sm:text-sm">
    {{ displayName() }}
  </h3>
</a>
