>
  <div
    aria-hidden="true"
    class="absolute -right-20 -top-24 h-72 w-72 rounded-full bg-serein-brand/[0.06] blur-3xl"
  ></div>
  <div

    class="absolute -bottom-24 -left-20 h-64 w-64 rounded-full bg-[#d8c1ae]/20 blur-3xl"
  ></div>

  <div class="relative flex max-w-md flex-col items-center">

    <h2 class="mt-2 font-display text-3xl text-serein-text sm:text-4xl">
