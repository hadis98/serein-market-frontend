<header class="sticky top-0 z-50 border-b border-black/5 bg-serein-bg/95 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
    <!-- Logo -->
    <a routerLink="/" class="font-display text-3xl tracking-tight"> Serein </a>

    <!-- Navigation -->
    <nav class="hidden items-center gap-8 md:flex">
      <a
        routerLink="/"
        routerLinkActive="font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm transition hover:text-serein-brand"
      >
        Home
      </a>

      <a
        routerLink="/products"
        routerLinkActive="font-semibold"
        class="text-sm transition hover:text-serein-brand"
      >
        Shop
      </a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <a
        routerLink="/wishlist"
        class="relative flex h-10 w-10 items-center justify-center rounded-full transition hover:bg-black/5"
        aria-label="Wishlist"
      >
        ♡

        @if (wishlist.count() > 0) {
          <span
            class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-serein-accent px-1 text-[10px] text-white"
          >
            {{ wishlist.count() }}
          </span>
        }
      </a>

      <a
        routerLink="/cart"
        class="flex items-center gap-2 rounded-full border border-serein-brand px-5 py-2 text-sm transition hover:bg-serein-brand hover:text-white"
      >
        Cart

        @if (cart.itemCount() > 0) {
          <span
            class="flex h-6 min-w-6 items-center justify-center rounded-full bg-serein-accent px-1.5 text-xs text-white"
          >
            {{ cart.itemCount() }}
          </span>
        }
      </a>
      @if (auth.isLoggedIn()) {
        <div class="flex items-center gap-3">
          <a routerLink="/profile" class="text-sm transition hover:text-serein-brand"
            >Hi, {{ auth.firstName() }}</a
          >

          <button type="button" class="text-sm text-serein-brand" (click)="logout()">Logout</button>
        </div>
      } @else {
        <a routerLink="/login" class="text-sm transition hover:text-serein-brand"> Sign in </a>
      }
    </div>
  </div>
</header>
