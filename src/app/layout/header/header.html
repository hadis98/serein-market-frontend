<header class="sticky top-0 z-50 border-b border-black/5 bg-serein-bg/95 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center gap-5 px-4 py-4 sm:px-6">
    <a routerLink="/" class="shrink-0 font-display text-3xl tracking-tight">Serein</a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="Primary navigation">
      <a
        routerLink="/"
        routerLinkActive="border-serein-text"
        [routerLinkActiveOptions]="{ exact: true }"
        class="border-b border-transparent py-2 text-sm transition hover:border-serein-text"
      >
        Home
      </a>
      <a
        routerLink="/products"
        routerLinkActive="border-serein-text"
        class="border-b border-transparent py-2 text-sm transition hover:border-serein-text"
      >
        Shop
      </a>
      <a
        routerLink="/"
        class="border-b border-transparent py-2 text-sm transition hover:border-serein-text"
      >
        Categories
      </a>
      <a
        routerLink="/"
        class="border-b border-transparent py-2 text-sm transition hover:border-serein-text"
      >
        About
      </a>
    </nav>

    <form
      role="search"
      class="mx-auto hidden max-w-md flex-1 items-center rounded-full bg-black/[0.045] px-4 md:flex"
      (submit)="submitSearch($event)"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-4 w-4 shrink-0 text-serein-text/65"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
      <label for="site-search" class="sr-only">Search products and categories</label>
      <input
        id="site-search"
        type="search"
        placeholder="Search for products, categories..."
        class="w-full bg-transparent px-3 py-2.5 text-xs outline-none placeholder:text-serein-text/45"
        [value]="searchTerm()"
        (input)="updateSearchTerm($event)"
      />
    </form>

    <div class="ml-auto flex shrink-0 items-center gap-1 sm:gap-2">
      <a
        routerLink="/wishlist"
        class="relative flex h-10 w-10 items-center justify-center rounded-full transition hover:bg-black/5 focus-visible:outline-2 focus-visible:outline-serein-brand"
        aria-label="Wishlist"
      >
        <svg
          viewBox="0 0 24 24"
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
          ></path>
        </svg>
        @if (wishlist.count() > 0) {
          <span
            class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-serein-brand px-1 text-[0.6rem] leading-none text-white"
          >
            {{ wishlist.count() }}
          </span>
        }
      </a>

      <a
        routerLink="/cart"
        class="relative flex h-10 w-10 items-center justify-center rounded-full transition hover:bg-black/5 focus-visible:outline-2 focus-visible:outline-serein-brand"
        aria-label="Shopping cart"
      >
        <svg
          viewBox="0 0 24 24"
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="20" r="1"></circle>
          <circle cx="19" cy="20" r="1"></circle>
          <path d="M3 4h2l2.4 10.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"></path>
        </svg>
        @if (cart.itemCount() > 0) {
          <span
            class="absolute -right-0.5 -top-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-serein-brand px-1 text-[0.6rem] leading-none text-white"
          >
            {{ cart.itemCount() }}
          </span>
        }
      </a>

      @if (auth.isAdmin()) {
        <div class="ml-1 border-l border-black/10 pl-3">
          <a
            routerLink="/admin"
            class="inline-flex h-10 items-center justify-center gap-2 rounded-2xl bg-black/[0.045] px-3 text-sm font-semibold transition hover:bg-black/[0.08] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-serein-brand sm:px-4"
            aria-label="Open admin panel"
          >
            <svg
              viewBox="0 0 24 24"
              class="h-5 w-5 shrink-0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3 4 6v6c0 5 3.4 8 8 10 4.6-2 8-5 8-10V6l-8-3Z"></path>
              <path d="m9 12 2 2 4-4"></path>
            </svg>
            <span class="hidden xl:inline">Admin panel</span>
          </a>
        </div>
      }

      @if (auth.isLoggedIn()) {
        <details class="group relative hidden sm:block">
          <summary
            class="flex cursor-pointer list-none items-center gap-1 rounded-full px-2 py-2 text-sm transition hover:bg-black/5"
          >
            Hi, {{ auth.firstName() }}
            <svg
              viewBox="0 0 20 20"
              class="h-4 w-4 transition group-open:rotate-180"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="m6 8 4 4 4-4"></path>
            </svg>
          </summary>
          <div
            class="absolute right-0 top-full mt-2 w-36 rounded-2xl border border-black/5 bg-serein-surface p-2 shadow-lg"
          >
            <a routerLink="/profile" class="block rounded-xl px-3 py-2 text-sm hover:bg-black/5">
              Profile
            </a>
            <button
              type="button"
              class="block w-full rounded-xl px-3 py-2 text-left text-sm text-serein-brand hover:bg-black/5"
              (click)="logout()"
            >
              Logout
            </button>
          </div>
        </details>
      } @else {
        <a
          routerLink="/login"
          class="hidden rounded-full px-3 py-2 text-sm transition hover:bg-black/5 sm:block"
        >
          Sign in
        </a>
      }
    </div>
  </div>
</header>
