<header
  class="sticky top-0 z-50 border-b border-black/5 bg-serein-bg/95 backdrop-blur"
>
  <div
    class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5"
  >
    <!-- Logo -->
    <a
      routerLink="/"
      class="font-display text-3xl tracking-tight"
    >
      Serein
    </a>

    <!-- Navigation -->
    <nav class="hidden items-center gap-8 md:flex">
      <a
        routerLink="/"
        routerLinkActive="font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm transition hover:text-serein-brand"
      >
        Home
      </a>

      <a
        routerLink="/products"
        routerLinkActive="font-semibold"
        class="text-sm transition hover:text-serein-brand"
      >
        Shop
      </a>
    </nav>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button
        class="rounded-full px-3 py-2 transition hover:bg-black/5"
        aria-label="Search"
      >
        ♡
      </button>

      <button
        class="rounded-full border border-serein-brand px-5 py-2 text-sm transition hover:bg-serein-brand hover:text-white"
      >
        Cart
      </button>
    </div>
  </div>
</header>
